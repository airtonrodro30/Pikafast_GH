spring.application.name=pikafast
server.port=8080

# Conexion base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/pikafast_db?serverTimezone=UTC
#Verificar Usuario y Contrase\u00f1a Propio
spring.datasource.username=root
spring.datasource.password=Nieves300305
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.security=DEBUG

# \u2190 si t\u00fa creas las tablas manualmente(none)de lo contraio (update)
spring.jpa.hibernate.ddl-auto=none
# \u2190 \u00datil para ver las consultas en consola     
spring.jpa.show-sql=true
# Usa los nombre de las columnas de la Tabla tal cual como esta sin convertir a snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Tama\u00f1o m\u00e1ximo permitido para un solo archivo subido (por ejemplo, una imagen o PDF).
spring.servlet.multipart.max-file-size=5MB
# Tama\u00f1o m\u00e1ximo total permitido para toda la solicitud HTTP multipart (puede incluir varios archivos o campos).
spring.servlet.multipart.max-request-size=5MB