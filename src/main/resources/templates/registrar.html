<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Pikafast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/credenciales.css}">
</head>
<body>
    <th:block th:with="hideHeaderOrderActions=true"
              th:replace="~{fragments/header :: headerFragment}"></th:block>


    <main class="container my-5 py-5">
        <div class="row align-items-center">
            <div class="col-lg-6 text-center d-none d-lg-block">
                <img src="assets/img/register.png" class="img-fluid" style="max-height: 60%;" alt="Registro Pikafast">
            </div>
            <!-- Formulario Registro -->
            <div class="col-lg-5 offset-lg-1 px-4">
                <h1 class="login-title mb-4">Registro</h1>
                <form th:action="@{/registrar}" method="post" th:object="${registroCliente}" id="register-form" >

                    <div th:if="${errorRegistro}" class="alert alert-danger" th:text="${errorRegistro}"></div>

                    <h2 class="register-section-title">Datos Personales</h2>
                    
                    <label class="login-label"><i class="bi bi-person me-2"></i>Nombres</label>
                    <div class="input-group input-group-pikafast mb-3">
                        <input type="text" th:field="*{nombres}" class="form-control" placeholder="Tus nombres" required>
                    </div>

                    <label class="login-label"><i class="bi bi-person-vcard me-2"></i>Apellidos</label>
                    <div class="input-group input-group-pikafast mb-3">
                        <input type="text" th:field="*{apellidos}" class="form-control" placeholder="Tus apellidos" required>
                    </div>

                    <label class="login-label"><i class="bi bi-card-text me-2"></i>DNI</label>
                    <div class="input-group input-group-pikafast mb-3">
                        <input type="text" th:field="*{dni}" class="form-control" placeholder="Tu DNI" required>
                    </div>

                    <label class="login-label"><i class="bi bi-telephone me-2"></i>Teléfono</label>
                    <div class="input-group input-group-pikafast mb-3">
                        <input type="tel" th:field="*{telefono}" class="form-control" placeholder="999 999 999" required>
                    </div>

                    <h2 class="register-section-title mt-4">Datos de Acceso</h2>

                    <label class="login-label"><i class="bi bi-envelope me-2"></i>Correo</label>
                    <div class="input-group input-group-pikafast mb-3">
                        <input type="email" th:field="*{email}" class="form-control" placeholder="nombre@ejemplo.com" required>
                    </div>

                    <label class="login-label"><i class="bi bi-lock me-2"></i>Contraseña</label>
                    <div class="input-group input-group-pikafast mb-3">
                        <input type="password" th:field="*{contrasenia}" id="password-input" class="form-control" required>
                        <span class="input-group-text btn-toggle-pass" style="cursor: pointer;">
                            <i class="bi bi-eye-slash bi-custom" style="font-size: 1.2rem;"></i>
                        </span>
                    </div>

                    <label class="login-label"><i class="bi bi-shield-lock me-2"></i>Confirmar contraseña</label>
                    <div class="input-group input-group-pikafast mb-3">
                        <input type="password" th:field="*{confirmarContrasenia}" class="form-control" required>
                    </div>


                    <button type="submit" class="btn btn-pikafast w-100 mb-3">Registrarse</button>
                    
                    <div class="text-center my-3 fw-bold" style="color: #ccc;">o</div>

                    <button type="button" class="btn-social-google w-100 mb-2">
                        <img src="https://www.google.com/favicon.ico" width="18"> Continuar con Google
                    </button>
                    <button type="button" class="btn-social-apple w-100">
                        <i class="bi bi-apple me-2"></i> Continuar con Apple
                    </button>
                    
                    <p class="text-center small mt-4">¿Ya tienes cuenta? <a th:href="@{/login}" class="login-link fw-bold">Inicia Sesión</a></p>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer-pikafast">
        <div class="container">
            <div class="row">
                <div class="col-md-3 mb-4"><img src="assets/img/logo.png" width="140"></div>
                <div class="col-md-2">
                    <h6>Sobre Nosotros</h6>
                    <a href="#">Historia</a><a href="#">Misión</a><a href="#">Visión</a>
                </div>
                <div class="col-md-4">
                    <h6>Contacto</h6>
                    <p><i class="bi bi-telephone-fill me-2"></i> 999 999 886</p>
                    <p><i class="bi bi-geo-alt-fill me-2"></i> Av. San Bartolo 137 Huancayo</p>
                </div>
                <div class="col-md-3">
                    <h6>Preguntas Frecuentes</h6>
                    <a href="#">¿Cómo pedir?</a><a href="#">Política de Devoluciones</a>
                </div>
            </div>
        </div>
    </footer>

    <div class="footer-bottom-bar text-center">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <span>CopyRight 2025 PIKAFAST all rights reserved</span>
            <div class="social-icons">
                <i class="bi bi-instagram"></i><i class="bi bi-facebook"></i><i class="bi bi-tiktok"></i>
            </div>
        </div>
    </div>
    <script th:src="@{assets/js/main.js}"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Lógica para mostrar/ocultar contraseña (se puede mover a main.js)
        document.querySelector('.btn-toggle-pass').addEventListener('click', function() {
            const passInput = document.getElementById('password-input');
            const icon = this.querySelector('i');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            } else {
                passInput.type = 'password';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            }
        });
    </script>
</body>
</html>
