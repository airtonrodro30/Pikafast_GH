<div th:fragment="footerFragment" class="site-footer">
    <link rel="stylesheet" th:href="@{/css/chat-widget.css}">

    <footer class="footer-pikafast">
        <div class="container">
            <div class="row">
                <div class="col-md-3 mb-4">
                    <img th:src="@{/assets/img/logo.png}" width="140">
                </div>
                <div class="col-md-2">
                    <h6>Sobre Nosotros</h6>
                    <a href="#">Historia</a><a href="#">Misión</a><a href="#">Visión</a>
                </div>
                <div class="col-md-4">
                    <h6>Contacto</h6>
                    <p><i class="bi bi-telephone-fill me-2"></i> 999 999 886</p>
                    <p><i class="bi bi-geo-alt-fill me-2"></i> Av. San Bartolo 137 Huancayo</p>
                </div>
                <div class="col-md-3">
                    <h6>Preguntas Frecuentes</h6>
                    <a href="#">¿Cómo pedir?</a><a href="#">Política de Devoluciones</a>
                </div>
            </div>
        </div>
    </footer>

    <div class="footer-bottom-bar text-center">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <span>CopyRight 2025 PIKAFAST all rights reserved</span>
            <div class="social-icons">
                <i class="bi bi-instagram"></i><i class="bi bi-facebook"></i><i class="bi bi-tiktok"></i>
            </div>
        </div>
    </div>

    <section id="pika-chat"
             class="pika-chat"
             data-endpoint="/api/v1/chat/full"
             data-max-messages="5">
        <button id="pika-chat-toggle"
                class="pika-chat__toggle"
                type="button"
                aria-label="Abrir chat de Pika AI">
            <img th:src="@{/assets/img/logo.png}" alt="Pika AI">
        </button>

        <div id="pika-chat-panel" class="pika-chat__panel" hidden>
            <header class="pika-chat__header">
                <div class="pika-chat__header-row">
                    <div class="pika-chat__brand">
                        <img th:src="@{/assets/img/logo.png}" alt="Pika AI">
                    </div>
                    <div>
                        <h2 class="pika-chat__title">Pika AI</h2>
                        <span id="pika-chat-counter" class="pika-chat__counter">0 de 5 mensajes disponibles</span>
                    </div>
                    <button id="pika-chat-close"
                            class="pika-chat__close"
                            type="button"
                            aria-label="Cerrar chat">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </header>

            <div id="pika-chat-messages" class="pika-chat__messages"></div>

            <div class="pika-chat__composer">
                <div id="pika-chat-status" class="pika-chat__status" hidden></div>
                <form id="pika-chat-form" class="pika-chat__form">
                    <textarea id="pika-chat-textarea"
                              class="form-control pika-chat__textarea"
                              rows="2"
                              maxlength="1200"
                              placeholder="Escribe tu consulta aqui..."
                              aria-label="Mensaje para Pika AI"></textarea>
                    <button id="pika-chat-send"
                            class="pika-chat__send"
                            type="submit"
                            aria-label="Enviar mensaje">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script th:src="@{/js/chat-widget.js}"></script>
</div>
