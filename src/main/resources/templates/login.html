<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pikafast - Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link rel="stylesheet" th:href="@{/css/credenciales.css}">
    </head>
    <body>
        <!-- Seccion Header -->
    <th:block th:replace="fragments/header :: headerFragment"></th:block>

    <main class="container my-5 py-5">
        <div class="row align-items-center">
            <div class="col-lg-5 px-4">
                <h1 class="login-title">Iniciar Sesión</h1>
                <!-- Formulario LOGIN -->
                <form th:action="@{/login}" method="post" id="login-form">
                    <label class="login-label">Correo electrónico</label>
                    <div class="input-group input-group-pikafast mb-3">
                        <span class="input-group-text"><i class="bi bi-envelope bi-custom" style="font-size: 1.2rem;"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="nombre@ejemplo.com" required>
                    </div>

                    <label class="login-label">Contraseña</label>
                    <div class="input-group input-group-pikafast mb-1">
                        <span class="input-group-text"><i class="bi bi-lock bi-custom" style="font-size: 1.2rem;"></i></span>
                        <input type="password" name="password" id="password-input" class="form-control" required>
                        <span class="input-group-text btn-toggle-pass" style="cursor: pointer;">
                            <i class="bi bi-eye-slash bi-custom" style="font-size: 1.2rem;"></i>
                        </span>
                    </div>

                    <a href="#" class="login-link small d-block mb-4">¿Olvidó la contraseña?</a>
                    <!-- ENVIAR FORMULARIO -->
                    <button type="submit" class="btn btn-pikafast w-100 mb-3">Continuar</button>

                    <p class="text-center small">¿No tienes cuenta? <a th:href="@{/registrar}" class="login-link fw-bold">Regístrese</a></p>

                    <div class="text-center my-3 fw-bold" style="color: #ccc;">o</div>

                    <button type="button" class="btn-social-google w-100 mb-2">
                        <img src="https://www.google.com/favicon.ico" width="18"> Continuar con Google
                    </button>
                    <button type="button" class="btn-social-apple w-100">
                        <i class="bi bi-apple me-2"></i> Continuar con Apple
                    </button>
                </form>
            </div>
            <div class="col-lg-7 text-center d-none d-lg-block">
                <img src="assets/img/login-illustration.png" class="img-fluid" style="max-height: 20%;">
            </div>
        </div>
    </main>


    <!-- Seccion Footer -->
    <th:block th:replace="fragments/footer :: footerFragment"></th:block>

    <!-- JS BootStrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous">
    </script>


    <script th:src="@{/js/login.js}"></script>
</body>
</html>
