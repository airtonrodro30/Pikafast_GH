<div th:fragment="usuarioFormModal">
    <div class="modal fade" id="usuarioModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content admin-modal">

                <div class="modal-header">
                    <h5 class="modal-title">Nuevo / Editar usuario</h5>
                    <a th:href="@{/dashboard/usuarios}"
                       class="btn-close"
                       aria-label="Cerrar">
                    </a>
                </div>

                <div class="modal-body">
                    <form th:action="@{/dashboard/usuarios/guardar}"
                          th:object="${usuario}"
                          method="post">

                        <input type="hidden" th:field="*{idUsuario}">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label>Nombre completo</label>
                                <input type="text"
                                       class="form-control admin-form-control"
                                       th:field="*{nombre}">
                            </div>

                            <div class="col-md-6">
                                <label>Email</label>
                                <input type="email"
                                       class="form-control admin-form-control"
                                       th:field="*{email}">
                            </div>

                            <div class="col-md-6">
                                <label>Teléfono</label>
                                <input type="text"
                                       class="form-control admin-form-control"
                                       th:field="*{telefono}">
                            </div>

                            <div class="col-md-6">
                                <label>Contraseña</label>
                                <input type="password"
                                       name="contrasenia"
                                       class="form-control admin-form-control"
                                       placeholder="Escribe una Contraseña">
                            </div>

                            <div class="col-md-6">
                                <label>Rol</label>
                                <select class="form-select admin-form-select"
                                        th:field="*{rol}">
                                    <option value="ADMIN">Administrador</option>
                                    <option value="EMPLEADO">Empleado</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label>Estado</label>
                                <select class="form-select admin-form-select"
                                        th:field="*{activo}">
                                    <option th:value="true">Activo</option>
                                    <option th:value="false">Inactivo</option>
                                </select>
                            </div>

                        </div>

                        <div class="modal-footer mt-4">
                            <a th:href="@{/dashboard/usuarios}"
                               class="btn btn-secondary">
                                Cancelar
                            </a>

                            <button type="submit"
                                    class="btn admin-btn">
                                Guardar
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- JS del Modal -->
    <script th:if="${abrirModal}">
        document.addEventListener("DOMContentLoaded", function () {
            const modal = new bootstrap.Modal(document.getElementById("usuarioModal"));
            modal.show();
        });
    </script>
</div>
