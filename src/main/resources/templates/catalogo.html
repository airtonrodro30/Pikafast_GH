<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Pikafast - Inicio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- CSS BootStrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
              crossorigin="anonymous">

        <!-- Iconos BootStrap -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!-- CSS Local -->
        <link rel="stylesheet" th:href="@{/css/base.css}">
        <link rel="stylesheet" th:href="@{/css/header.css}">
        <link rel="stylesheet" th:href="@{/css/footer.css}">
        <link rel="stylesheet" th:href="@{/css/carrito.css}">
        <link rel="stylesheet" th:href="@{/css/catalogo.css}">
    </head>

    <body>
        <!-- Seccion Header -->
    <th:block th:replace="~{fragments/header :: headerFragment}"></th:block>

    <!-- MAIN SECTION -->
    <main class="container my-2 py-2">
        <div class="row mb-4">
            <div class="col-12">
                <div class="catalog-banner">
                    <img src="assets/img/banner_dulces.jpg" th:src="@{/assets/img/alfajores.png}" alt="Nuestros productos premium" class="img-fluid w-100 rounded-3">
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- ASIDE CATALOGO -->
            <th:block th:replace="~{fragments/asideCatalogo :: asideFragment}"></th:block>
            
            <!-- CATALOGO CONTENT -->
            <section class="col-lg-9">
                <div class="d-flex align-items-center mb-4">
                    <a th:href="@{/productos}" class="text-decoration-none text-dark me-2">
                        <i class="bi bi-arrow-left-circle-fill fs-3 text-brown"></i>
                    </a>
                    <h2 class="catalog-section-title my-0"
                        th:text="${categoriaSeleccionada != null ? categoriaSeleccionada.nombre : 'Todos'}"></h2>
                </div>

                <div class="row g-4">
                    <div class="col-md-6 col-xl-4" th:each="producto : ${listaProductos}">
                        <div class="catalog-product-card" >
                            <div class="product-img-wrapper">
                                <img th:src="@{'/uploaded-images/' + ${producto.imagen}}" alt="${producto.nombre}">
                            </div>
                            <div class="catalog-product-body">
                                <h4 class="product-title" th:text="${producto.nombre}"></h4>
                                <p class="product-description" th:text="${producto.descripcion}"></p>
                                <div class="product-footer-meta">
                                    <span class="product-price" th:text="'S/.' + ${producto.precio}"></span>
                                    <button class="btn-add-cart" title="Agregar al carrito">
                                        <i class="bi bi-plus-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Seccion Footer -->
    <th:block th:replace="~{fragments/footer :: footerFragment}"></th:block>

    <!-- JS BootStrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
            crossorigin="anonymous">
    </script>

    <!-- JS Local -->
    <script type="module" th:src="@{/js/index.js}"></script>
</body>
</html>
