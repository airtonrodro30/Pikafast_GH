
<div th:fragment="dashboardContent">
    <!-- Contenido del Modulo Usuarios -->
    <main  class="admin-content">
        <div class="admin-topbar">
            <h1 class="admin-page-title">Mantenimiento de Usuarios</h1>
            <p class="admin-page-subtitle">Crear, editar o eliminar usuarios del sistema.</p>
        </div>

        <section class="admin-panel mb-4">
            <div class="admin-header">
                <div>
                    <h2 class="section-title mb-1">Listado de usuarios</h2>
                    <p class="section-subtitle mb-0">Gestiona los usuarios administradores y clientes.</p>
                </div>
                <!-- Modal Trigger -->
                <button class="btn admin-btn" data-bs-toggle="modal" data-bs-target="#usuarioModal">
                    <i class="bi bi-plus-lg me-2"></i>Nuevo usuario
                </button>
            </div>

            <div class="row g-3 mt-2">
                <div class="col-lg-6">
                    <div class="input-group admin-search">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" placeholder="Buscar usuario...">
                    </div>
                </div>
                <div class="col-lg-3">
                    <select class="form-select admin-form-select">
                        <option selected>Todos los roles</option>
                        <option>Admin</option>
                        <option>Cliente</option>
                    </select>
                </div>
                <div class="col-lg-3">
                    <select class="form-select admin-form-select">
                        <option selected>Estado</option>
                        <option>Activo</option>
                        <option>Inactivo</option>
                    </select>
                </div>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td>
                            <i class="bi bi-person-circle me-2"></i>
                            <span th:text="${usuario.nombre}">Nombre usuario</span>
                        </td>

                        <td th:text="${usuario.email}">email@ejemplo.com</td>

                        <td>
                            <span 
                                class="badge"
                                th:classappend="${usuario.rol.name == 'ADMIN'} ? ' badge-admin' : ' badge-empleado'"
                                th:text="${#strings.capitalize(#strings.toLowerCase(usuario.rol.name()))}">
                                Rol
                            </span>
                        </td>

                        <td>
                            <span 
                                class="badge"
                                th:classappend="${usuario.activo} ? ' badge-activo' : ' badge-inactivo'"
                                th:text="${usuario.activo} ? 'Activo' : 'Inactivo'">
                                Estado
                            </span>
                        </td>

                        <td class="d-flex gap-2">
                            <a 
                                class="btn-edit"
                                th:href="@{/dashboard/usuarios/editar/{id}(id=${usuario.idUsuario})}">
                                <i class="bi bi-pencil-square me-1"></i>Editar
                            </a>

                            <a 
                                class="btn-delete"
                                th:href="@{/dashboard/usuarios/eliminar/{id}(id=${usuario.idUsuario})}"
                                onclick="return confirm('¿Seguro que deseas eliminar este usuario?')">
                                <i class="bi bi-trash3 me-1"></i>Eliminar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- MODAL -->
    <th:block th:replace="~{modal/usuario-form :: usuarioFormModal}"></th:block>
</div>
