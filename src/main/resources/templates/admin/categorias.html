<main th:fragment="dashboardContent" class="admin-content">

    <div class="admin-topbar">
        <h1 class="admin-page-title">Mantenimiento de Categorías</h1>
        <p class="admin-page-subtitle">
            Crear, editar o eliminar categorías del catálogo.
        </p>
    </div>

    <section class="admin-panel mb-4">
        <div class="admin-header">
            <div>
                <h2 class="section-title mb-1">Listado de categorías</h2>
                <p class="section-subtitle mb-0">
                    Categorías que aparecen en el header del sitio del cliente.
                </p>
            </div>

            <button class="btn admin-btn"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#categoriaModal">
                <i class="bi bi-plus-lg me-2"></i>
                Nueva categoría
            </button>
        </div>

        <div class="row g-3 mt-2">
            <div class="col-lg-4">
                <div class="input-group admin-search">
                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>

                    <input type="text"
                           class="form-control"
                           placeholder="Buscar categoría...">
                </div>
            </div>
        </div>
    </section>

    <section class="row g-4">

    <div class="col-md-6 col-xl-4"
         th:each="cat : ${listaCategorias}">

        <div class="category-admin-card">

            <div class="category-admin-icon">
                <i class="bi bi-grid-fill"></i>
            </div>

            <h3 th:text="${cat.nombre}">
                NOMBRE
            </h3>

            <p th:text="${cat.descripcion}">
                DESCRIPCION
            </p>

            <span class="category-admin-count">
                Categoría registrada
            </span>

            <div class="product-admin-actions mt-3">

                <!-- EDITAR -->
                <button class="btn-edit"
                        type="button"
                        data-bs-toggle="modal"
                        data-bs-target="#categoriaModal">

                    <i class="bi bi-pencil-square me-1"></i>
                    Editar
                </button>

                <!-- ELIMINAR -->
                <a th:href="@{/dashboard/categorias/eliminar/{id}(id=${cat.idCategoria})}"
                   class="btn-delete">

                    <i class="bi bi-trash3 me-1"></i>
                    Eliminar
                </a>

            </div>

        </div>

    </div>

</section>

    <!-- MODAL -->
    <div class="modal fade"
         id="categoriaModal"
         tabindex="-1"
         aria-labelledby="categoriaModalLabel"
         aria-hidden="true">

        <div class="modal-dialog">
            <div class="modal-content">

                <form th:action="@{/dashboard/categorias/guardar}"
                      method="post"
                      th:object="${categoria}">

                    <div class="modal-header">

                        <h5 class="modal-title"
                            id="categoriaModalLabel">
                            Nueva Categoría
                        </h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                        </button>

                    </div>

                    <div class="modal-body">

                        <input type="hidden"
                               th:field="*{idCategoria}">

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{nombre}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Descripción
                            </label>

                            <textarea class="form-control"
                                      th:field="*{descripcion}">
                            </textarea>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit"
                                class="btn admin-btn">
                            Guardar
                        </button>

                    </div>

                </form>

            </div>
        </div>
    </div>

</main>
